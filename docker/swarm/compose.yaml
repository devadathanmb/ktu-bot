      - source: db-ca-certificate
        target: /certs/db-ca.pem
        mode: 0444
    networks:
      - ktu-bot-overlay
    ports:
      - "3003:3003"
    command: ["pnpm", "workers:data-sync-worker"]
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
        monitor: 30s
        max_failure_ratio: 0.3
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          memory: 192M
          cpus: "0.15"
        reservations:
          memory: 96M
          cpus: "0.05"
      labels:
        - "com.ktu-bot.role=worker"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - -s
        - -S
        - --max-time
        - "5"
        - http://localhost:3003/health
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Attachment Delivery Worker
  attachment-delivery-worker:
    image: ${REGISTRY:-docker.io/library}/ktu-bot-private:${TAG:-latest}
    env_file:
      - ../../env/staging/.env.swarm
      - ../../env/staging/attachment-delivery-worker.env
    configs:
      - source: db-ca-certificate
        target: /certs/db-ca.pem
        mode: 0444
    networks:
      - ktu-bot-overlay
    ports:
      - "3004:3004"
    command: ["pnpm", "workers:attachment-delivery-worker"]
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
        monitor: 30s
        max_failure_ratio: 0.3
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          memory: 200M
          cpus: "0.30"
        reservations:
          memory: 100M
          cpus: "0.10"
      labels:
        - "com.ktu-bot.role=worker"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - -s
        - -S
        - --max-time
        - "5"
        - http://localhost:3004/health
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Bull Board (Queue Dashboard)
  bull-board-service:
    image: ${REGISTRY:-docker.io/library}/ktu-bot-private:${TAG:-latest}
    env_file:
      - ../../env/staging/.env.swarm
    configs:
      - source: db-ca-certificate
        target: /certs/db-ca.pem
        mode: 0444
    networks:
      - ktu-bot-overlay
    ports:
      - "3010:3010"
    command: ["pnpm", "services:bull-board"]
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
        monitor: 30s
        max_failure_ratio: 0.3
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          memory: 128M
          cpus: "0.10"
        reservations:
          memory: 64M
          cpus: "0.05"
      labels:
        - "com.ktu-bot.role=dashboard"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - -s
        - -S
        - --max-time
        - "5"
        - http://localhost:3010/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
